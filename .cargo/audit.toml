# Configuration for cargo audit (https://github.com/rustsec/rustsec).
#
# Exceptions cover historical parser versions compiled by the time machine.
# Unmaintained-crate warnings remain visible.
[advisories]
ignore = [
    # fast-float 0.2.0: segfault (no upstream fix) and soundness issues. Pulled
    # only by the historical databend-common-ast 0.0.3 that the time-machine
    # crate compiles to benchmark old releases. Current databend uses the
    # maintained fast-float2 fork, so this never reaches the core benchmark.
    "RUSTSEC-2025-0003",
    "RUSTSEC-2024-0379",
    # rtrb 0.2.3: double free / use-after-free in ReadChunk::commit when an
    # element's Drop panics (RUSTSEC-2026-0274, fixed in rtrb ^0.3.5). Pulled
    # only by fastrace 0.6.8, which is itself pulled only by the historical
    # databend-common-ast 0.0.3 pinned in the timemachine crate for benchmarking
    # old releases. It is not reachable from the core benchmark or the site.
    "RUSTSEC-2026-0274",
]
